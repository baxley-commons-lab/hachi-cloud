<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peach Tree AI Learning Map</title>
  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {

<body class="bg-[#07090b] text-zinc-100 min-h-screen">
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo } = React;

// ── Inline icons ──────────────────────────────────────────────────────────
const Icon = ({ path, ...p }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" {...p}>{path}</svg>
);
const Mail        = p => <Icon {...p} path={<><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></>}/>;
const Newspaper   = p => <Icon {...p} path={<><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a4 4 0 0 1-4-4V6"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 10.5H8M16 13.5H8M16 16.5H8"/></>}/>;
const CalendarDays= p => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8" cy="14" r=".5" fill="currentColor"/><circle cx="12" cy="14" r=".5" fill="currentColor"/><circle cx="16" cy="14" r=".5" fill="currentColor"/><circle cx="8" cy="18" r=".5" fill="currentColor"/><circle cx="12" cy="18" r=".5" fill="currentColor"/><circle cx="16" cy="18" r=".5" fill="currentColor"/></>}/>;
const Megaphone   = p => <Icon {...p} path={<><path d="M3 11l19-9-9 19-2-8-8-2z"/></>}/>;
const ListChecks  = p => <Icon {...p} path={<><path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/></>}/>;
const Hammer      = p => <Icon {...p} path={<><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6A5.56 5.56 0 0 0 12.07 3H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47z"/></>}/>;
const TreePine    = p => <Icon {...p} path={<><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14l-.7-1.4a1 1 0 0 1 .7-1.6h.8l-2-3.3a1 1 0 0 1 .8-1.7h.5L6.4 3.3A1 1 0 0 1 7.3 2h9.4a1 1 0 0 1 .9 1.3L16.7 6h.5a1 1 0 0 1 .8 1.7l-2 3.3h.8a1 1 0 0 1 .7 1.6z"/><path d="M12 22v-3"/></>}/>;
const ChevronRight= p => <Icon {...p} path={<path d="m9 18 6-6-6-6"/>}/>;
const Smartphone  = p => <Icon {...p} path={<><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></>}/>;
const Monitor     = p => <Icon {...p} path={<><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></>}/>;
const Sparkles    = p => <Icon {...p} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275z"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4"/></>}/>;
const ShieldCheck = p => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></>}/>;
const CheckCircle2= p => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>}/>;
const Circle      = p => <Icon {...p} path={<circle cx="12" cy="12" r="10"/>}/>;

// ── Data ──────────────────────────────────────────────────────────────────
const modules = [
  {
    id: "email", title: "Answer Emails", IconComp: Mail, status: "Start Here",
    simple: "Use AI to read, summarize, and draft clear replies without sounding fake.",
    peachTree: "Like Peach Tree numbers: first get the facts clean, then decide what response is needed.",
    tasks: ["Paste one email", "Ask for a plain summary", "Ask for 3 reply options", "Choose and edit the best one"],
  },
  {
    id: "newsletter", title: "Newsletters", IconComp: Newspaper, status: "Next",
    simple: "Turn rough updates into simple newsletters people actually understand.",
    peachTree: "Use the same structure as a deal update: what changed, why it matters, what to do next.",
    tasks: ["Add rough notes", "Pick audience", "Generate first draft", "Simplify and send"],
  },
  {
    id: "marketing", title: "Marketing Posts", IconComp: Megaphone, status: "Practice",
    simple: "Create Facebook, email, and local-trust posts from one property or offer.",
    peachTree: "Translate the land deal into value: shovel-ready, entitled, lots, timeline, upside.",
    tasks: ["Enter offer facts", "Choose tone", "Generate 3 posts", "Pick the clearest CTA"],
  },
  {
    id: "calendar", title: "Calendar + Follow-up", IconComp: CalendarDays, status: "Useful Soon",
    simple: "Use AI to prepare meetings, track promises, and remind you what matters next.",
    peachTree: "Like partner meetings: decisions need dates, owners, costs, and next steps.",
    tasks: ["Add meeting notes", "Extract action items", "Assign dates", "Create follow-up message"],
  },
  {
    id: "tasks", title: "To-Do Lists", IconComp: ListChecks, status: "Daily Habit",
    simple: "Turn messy thoughts into a short action list that does not overwhelm you.",
    peachTree: "Separate critical numbers from nice-to-have details. Do the RED items first.",
    tasks: ["Brain dump", "Sort by urgency", "Pick top 3", "Review at end of day"],
  },
];

const chiselLevels = [
  { level: "0.5", label: "Just Do It For Me",  description: "AI gives one clean answer. No theory. No extra options." },
  { level: "1",   label: "Show Me the Steps",  description: "AI explains the simple process so I can repeat it." },
  { level: "2",   label: "Let Me Compare",     description: "AI gives options, pros/cons, and helps me choose." },
  { level: "3",   label: "Teach the Pattern",  description: "AI explains the reusable method behind the answer." },
  { level: "5",   label: "Build the System",   description: "AI turns the workflow into templates, checklists, and repeatable tools." },
];

const samplePrompts = [
  "Summarize this email in plain English and tell me what I need to do next.",
  "Draft a friendly reply that sounds like me: simple, honest, and not corporate.",
  "Turn these rough notes into a short newsletter for local customers.",
  "Make a to-do list from this meeting and separate urgent from optional.",
];

// ── Competency constants ──────────────────────────────────────────────────
const STATES = ['needs-assistance', 'understands-pattern', 'can-do-alone'];
const STATE_LABELS = {
  'needs-assistance':    'I need assistance',
  'understands-pattern': 'I understand the pattern',
  'can-do-alone':        'I can do this alone',
};

// ── Persistence ───────────────────────────────────────────────────────────
function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── Node: inline SVG (used in HTML flow) ─────────────────────────────────
function NodeIcon({ state, selected, size = 20 }) {
  const half = size / 2;
  const cr = half - 2;          // circle radius
  const ir = cr * 0.56;         // inner radius for dual-ring state
  const accent = "#34d399";
  const stroke = selected ? accent : "#52525b";

  if (state === 'needs-assistance') {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={half} cy={half} r={cr}
          fill="none" stroke={stroke} strokeWidth="1.5" strokeDasharray="3 2.5" />
      </svg>
    );
  }
  if (state === 'understands-pattern') {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={half} cy={half} r={cr}
          fill="none" stroke={stroke} strokeWidth="1.5" strokeDasharray="3 2.5" />
        <circle cx={half} cy={half} r={ir}
          fill="none" stroke={stroke} strokeWidth="1" />
        {/* Upper half fill */}
        <path d={`M${half - ir} ${half} A${ir} ${ir} 0 0 1 ${half + ir} ${half} Z`}
          fill={selected ? "#34d39955" : "#71717a"} />
      </svg>
    );
  }
  // can-do-alone: solid, quiet
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={half} cy={half} r={cr}
        fill={selected ? "#34d39922" : "#3f3f46"} stroke={stroke} strokeWidth="1.5" />
    </svg>
  );
}

// ── Node: SVG primitive (used inside <svg>) ───────────────────────────────
function MapNode({ cx, cy, r, state, selected }) {
  const ir = r * 0.56;
  const accent = "#34d399";
  const stroke = selected ? accent : "#52525b";

  if (state === 'needs-assistance') {
    return (
      <circle cx={cx} cy={cy} r={r}
        fill="none" stroke={stroke} strokeWidth="1.5" strokeDasharray="3 2.5" />
    );
  }
  if (state === 'understands-pattern') {
    return (
      <g>
        <circle cx={cx} cy={cy} r={r}
          fill="none" stroke={stroke} strokeWidth="1.5" strokeDasharray="3 2.5" />
        <circle cx={cx} cy={cy} r={ir}
          fill="none" stroke={stroke} strokeWidth="1" />
        <path d={`M${cx - ir} ${cy} A${ir} ${ir} 0 0 1 ${cx + ir} ${cy} Z`}
          fill={selected ? "#34d39955" : "#71717a"} />
      </g>
    );
  }
  return (
    <circle cx={cx} cy={cy} r={r}
      fill={selected ? "#34d39920" : "#3f3f46"} stroke={stroke} strokeWidth="1.5" />
  );
}

// ── Branch Map ─────────────────────────────────────────────────────────────
function BranchMap({ competency, chiselExplored, recency, selectedId, onSelect }) {
  const W = 290, H = 236;
  const TX = 26;                         // trunk X
  const T = 18, B = H - 24;             // top / bottom Y
  const NX = 118, NR = 10;              // node X, node radius
  const modIds = modules.map(m => m.id);

  // most recently used → bottom (high i → high y)
  const sorted = [...modIds].sort((a, b) => {
    const ai = recency.indexOf(a), bi = recency.indexOf(b);
    const ap = ai === -1 ? 9999 : ai, bp = bi === -1 ? 9999 : bi;
    return bp - ap; // least recent → top
  });

  const step = sorted.length > 1 ? (B - T) / (sorted.length - 1) : 0;

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ fontFamily: 'ui-monospace,monospace' }}>
      {/* Trunk */}
      <line x1={TX} y1={T} x2={TX} y2={B}
        stroke="#3f3f46" strokeWidth="1.5" strokeDasharray="4 3" />
      <text x={TX} y={B + 16} textAnchor="middle" fill="#52525b" fontSize="7.5" letterSpacing="1.8">NOW</text>

      {sorted.map((id, i) => {
        const mod = modules.find(m => m.id === id);
        if (!mod) return null;
        const y   = T + i * step;
        const st  = competency[id] || 'needs-assistance';
        const sel = id === selectedId;
        const bc  = sel ? "#34d399" : "#3f3f46";
        const lc  = sel ? "#e4e4e7" : "#71717a";
        const ex  = chiselExplored[id];

        return (
          <g key={id} onClick={() => onSelect(id)} style={{ cursor: 'pointer' }}>
            <line x1={TX - 4} y1={y} x2={TX} y2={y} stroke="#3f3f46" strokeWidth="1" />
            <line x1={TX} y1={y} x2={NX - NR - 2} y2={y} stroke={bc} strokeWidth="1" />
            <MapNode cx={NX} cy={y} r={NR} state={st} selected={sel} />
            <text x={NX + NR + 6} y={y - 1} fill={lc} fontSize="9" fontWeight={sel ? "600" : "400"}>
              {mod.title}
            </text>
            {ex && (
              <text x={NX + NR + 6} y={y + 9} fill="#52525b" fontSize="7.5">
                chisel {ex}
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

// ── Self-report prompt ─────────────────────────────────────────────────────
function SelfReport({ moduleName, onYes, onNo }) {
  return (
    <div className="slide-down mt-3 rounded-2xl border border-zinc-700/60 bg-zinc-900/80 p-4">
      <p className="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-2">Reflection</p>
      <p className="text-sm text-zinc-300 leading-6">
        You just used AI for <span className="text-zinc-100 font-medium">{moduleName}</span>.
        Could you do that again without the steps?
      </p>
      <div className="flex gap-2 mt-3">
        <button onClick={onYes}
          className="rounded-xl border border-emerald-400/30 bg-emerald-400/8 px-4 py-1.5 text-xs text-emerald-300 hover:bg-emerald-400/15 transition font-mono">
          Yes — mark it
        </button>
        <button onClick={onNo}
          className="rounded-xl border border-zinc-700 bg-zinc-800 px-4 py-1.5 text-xs text-zinc-500 hover:text-zinc-400 hover:bg-zinc-700 transition font-mono">
          Not yet
        </button>
      </div>
    </div>
  );
}

// ── Competency badge ───────────────────────────────────────────────────────
function StateBadge({ state }) {
  const styles = {
    'needs-assistance':    'text-zinc-500 border-zinc-700',
    'understands-pattern': 'text-zinc-400 border-zinc-600',
    'can-do-alone':        'text-emerald-400 border-emerald-400/35',
  };
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-xs font-mono ${styles[state]}`}>
      <NodeIcon state={state} size={10} />
      {STATE_LABELS[state]}
    </span>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [selectedId, setSelectedId] = useState(() => loadLS('pt_selected', 'email'));
  const [chisel, setChisel]         = useState("1");
  const [animKey, setAnimKey]       = useState(0);

  const [competency,     setCompetency]     = useState(() =>
    loadLS('pt_competency', Object.fromEntries(modules.map(m => [m.id, 'needs-assistance'])))
  );
  const [chiselExplored, setChiselExplored] = useState(() =>
    loadLS('pt_chisel_explored', {})
  );
  const [recency, setRecency] = useState(() =>
    loadLS('pt_recency', modules.map(m => m.id))
  );
  const [selfReport, setSelfReport] = useState(null);

  const selected       = useMemo(() => modules.find(m => m.id === selectedId), [selectedId]);
  const selectedChisel = chiselLevels.find(c => c.level === chisel);
  const currentState   = competency[selectedId] || 'needs-assistance';

  function selectModule(id) {
    setSelectedId(id);
    setAnimKey(k => k + 1);
    setSelfReport(null);
    saveLS('pt_selected', id);
    setRecency(prev => {
      const next = [id, ...prev.filter(x => x !== id)];
      saveLS('pt_recency', next);
      return next;
    });
  }

  function handlePromptClick(prompt) {
    navigator.clipboard?.writeText(prompt);
    setChiselExplored(prev => {
      const next = { ...prev, [selectedId]: chisel };
      saveLS('pt_chisel_explored', next);
      return next;
    });
    setRecency(prev => {
      const next = [selectedId, ...prev.filter(x => x !== selectedId)];
      saveLS('pt_recency', next);
      return next;
    });
    setSelfReport({ moduleId: selectedId });
  }

  function advanceCompetency(moduleId) {
    setCompetency(prev => {
      const idx  = STATES.indexOf(prev[moduleId] || 'needs-assistance');
      const next = { ...prev, [moduleId]: STATES[Math.min(idx + 1, STATES.length - 1)] };
      saveLS('pt_competency', next);
      return next;
    });
    setSelfReport(null);
  }

  return (
    <div className="mx-auto flex max-w-7xl flex-col gap-5 px-4 py-5 md:px-8 md:py-8">

      {/* ── Header ── */}
      <header className="grid gap-4 rounded-[2rem] border border-zinc-800 bg-zinc-950/80 p-5 shadow-2xl md:grid-cols-[1.2fr_.8fr] md:p-7">
        <div>
          <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-400/10 px-3 py-1 text-sm text-emerald-200">
            <TreePine className="h-4 w-4" /> Peach Tree AI Learning Map
          </div>
          <h1 className="text-3xl font-black tracking-tight md:text-5xl">
            Learn AI one useful job at a time.
          </h1>
          <p className="mt-3 max-w-2xl text-base leading-7 text-zinc-300 md:text-lg">
            A beginner guide for Mike and other business owners: start with real work,
            keep the screen simple, then use chisel levels to go deeper only when needed.
          </p>
          <div className="mt-5">
            <button onClick={() => selectModule("email")}
              className="rounded-2xl bg-emerald-400 px-5 py-2 font-semibold text-zinc-950 hover:bg-emerald-300 transition">
              Start Today's Lesson
            </button>
          </div>
        </div>

        {/* Branch map panel */}
        <div className="rounded-[1.75rem] border border-zinc-800 bg-zinc-900/30 p-4 flex flex-col gap-2">
          <p className="text-xs font-mono text-zinc-600 tracking-widest uppercase">Competency Map</p>
          <div className="flex-1">
            <BranchMap
              competency={competency}
              chiselExplored={chiselExplored}
              recency={recency}
              selectedId={selectedId}
              onSelect={selectModule}
            />
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 pt-1 border-t border-zinc-800/60">
            {STATES.map(s => (
              <span key={s} className="flex items-center gap-1.5 text-xs text-zinc-600 font-mono">
                <NodeIcon state={s} size={11} /> {STATE_LABELS[s].toLowerCase()}
              </span>
            ))}
          </div>
        </div>
      </header>

      {/* ── Body ── */}
      <section className="grid gap-5 lg:grid-cols-[300px_1fr]">

        {/* ── Sidebar ── */}
        <aside className="space-y-2">
          <div className="flex items-center justify-between px-1 mb-1">
            <h2 className="text-xs font-mono text-zinc-600 tracking-widest uppercase">Learning Tracks</h2>
            <div className="flex gap-1 text-zinc-700">
              <Monitor className="h-4 w-4" /><Smartphone className="h-4 w-4" />
            </div>
          </div>
          {modules.map(mod => {
            const active   = mod.id === selectedId;
            const state    = competency[mod.id] || 'needs-assistance';
            const explored = chiselExplored[mod.id];
            return (
              <button key={mod.id} onClick={() => selectModule(mod.id)}
                className={`w-full rounded-2xl border p-3.5 text-left transition ${
                  active
                    ? "border-zinc-700 bg-zinc-900"
                    : "border-zinc-800 bg-zinc-950 hover:bg-zinc-900"
                }`}>
                <div className="flex items-center gap-3">
                  <NodeIcon state={state} selected={active} size={22} />
                  <div className="min-w-0 flex-1">
                    <p className={`truncate text-sm font-semibold ${active ? 'text-zinc-100' : 'text-zinc-400'}`}>
                      {mod.title}
                    </p>
                    <p className="mt-0.5 text-xs text-zinc-600 font-mono">
                      {STATE_LABELS[state]}{explored ? ` · chisel ${explored}` : ''}
                    </p>
                  </div>
                  {active && <ChevronRight className="h-4 w-4 text-zinc-700 flex-shrink-0" />}
                </div>
              </button>
            );
          })}
        </aside>

        {/* ── Main ── */}
        <main className="grid gap-5 xl:grid-cols-[1fr_320px]">
          <div key={animKey} className="fade-up space-y-5">

            {/* Lesson card */}
            <div className="rounded-[2rem] border border-zinc-800 bg-zinc-950 p-5 md:p-7">
              <div className="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
                <div className="flex-1">
                  <p className="text-xs font-mono text-zinc-600 uppercase tracking-widest mb-1">Active track</p>
                  <h2 className="mt-1 text-3xl font-black">{selected.title}</h2>
                  <p className="mt-3 text-zinc-300 leading-7">{selected.simple}</p>
                </div>
                <div className="flex flex-col items-start md:items-end gap-2 flex-shrink-0">
                  <StateBadge state={currentState} />
                  {chiselExplored[selectedId] && (
                    <span className="text-xs font-mono text-zinc-600">
                      chisel {chiselExplored[selectedId]} explored
                    </span>
                  )}
                </div>
              </div>

              <div className="mt-6 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4">
                <div className="mb-2 flex items-center gap-2 text-sm font-bold text-amber-200">
                  <TreePine className="h-4 w-4" /> Peach Tree Translation
                </div>
                <p className="text-sm leading-6 text-zinc-300">{selected.peachTree}</p>
              </div>

              <div className="mt-6 grid gap-3 md:grid-cols-2">
                {selected.tasks.map((task, i) => (
                  <div key={task} className="flex items-center gap-3 rounded-2xl border border-zinc-800 bg-zinc-900/50 p-4">
                    {i === 0
                      ? <CheckCircle2 className="h-5 w-5 text-emerald-400 flex-shrink-0" />
                      : <Circle       className="h-5 w-5 text-zinc-700 flex-shrink-0" />}
                    <span className="text-sm text-zinc-200">{task}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Chisel card */}
            <div className="rounded-[2rem] border border-zinc-800 bg-zinc-950 p-5 md:p-7">
              <div className="flex items-center gap-2 mb-1">
                <Hammer className="h-4 w-4 text-zinc-600" />
                <h3 className="text-sm font-mono text-zinc-500 uppercase tracking-widest">Chisel Level</h3>
                <span className="text-xs text-zinc-700">— how deep to go</span>
              </div>
              <div className="grid gap-2 md:grid-cols-5 mt-4">
                {chiselLevels.map(item => (
                  <button key={item.level} onClick={() => setChisel(item.level)}
                    className={`rounded-2xl border p-3 text-left transition ${
                      chisel === item.level
                        ? "border-zinc-600 bg-zinc-900"
                        : "border-zinc-800 bg-zinc-950 hover:bg-zinc-900"
                    }`}>
                    <p className="text-lg font-black text-zinc-300">{item.level}</p>
                    <p className="mt-1 text-xs text-zinc-500">{item.label}</p>
                  </button>
                ))}
              </div>
              <div className="mt-4 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4">
                <p className="text-xs font-mono text-zinc-500 uppercase tracking-widest">
                  Chisel {selectedChisel.level} — {selectedChisel.label}
                </p>
                <p className="mt-2 text-sm leading-6 text-zinc-300">{selectedChisel.description}</p>
              </div>
            </div>
          </div>

          {/* ── Right sidebar ── */}
          <aside className="space-y-5">
            <div className="rounded-[2rem] border border-zinc-800 bg-zinc-950 p-5">
              <div className="mb-4 flex items-center gap-2">
                <Sparkles className="h-4 w-4 text-zinc-600" />
                <h3 className="text-xs font-mono text-zinc-600 uppercase tracking-widest">Prompt Starters</h3>
              </div>
              <div className="space-y-3">
                {samplePrompts.map(prompt => (
                  <button key={prompt} onClick={() => handlePromptClick(prompt)} title="Click to copy"
                    className="w-full rounded-2xl border border-zinc-800 bg-zinc-900/50 p-3 text-left text-sm leading-6 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-200 transition">
                    "{prompt}"
                  </button>
                ))}
              </div>
              {selfReport && selfReport.moduleId === selectedId && (
                <SelfReport
                  moduleName={selected.title}
                  onYes={() => advanceCompetency(selectedId)}
                  onNo={() => setSelfReport(null)}
                />
              )}
            </div>

            <div className="rounded-[2rem] border border-zinc-800 bg-zinc-950 p-5">
              <div className="mb-4 flex items-center gap-2">
                <ShieldCheck className="h-4 w-4 text-zinc-600" />
                <h3 className="text-xs font-mono text-zinc-600 uppercase tracking-widest">Guardrails</h3>
              </div>
              <div className="space-y-3 text-sm leading-6 text-zinc-500">
                <p>1. Do not paste passwords, bank info, or private legal details.</p>
                <p>2. Ask AI to summarize before asking it to decide.</p>
                <p>3. Always review before sending.</p>
                <p>4. Keep one clear next action.</p>
              </div>
            </div>
          </aside>
        </main>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
